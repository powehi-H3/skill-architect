name: Skill Architect — Offline Gates V1

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/fixtures/offline-builder-v0/**"
      - "scripts/audit_offline_harness_v1.py"
      - "scripts/validate_offline_fixture_semantics_v2.py"
      - "scripts/run_builder_offline.py"
      - "docs/OFFLINE-TEST-ARCHITECTURE-V1.md"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fixture semantics gate
        run: python3 scripts/validate_offline_fixture_semantics_v2.py
      - name: Adversarial harness gate
        run: python3 scripts/audit_offline_harness_v1.py
      - name: Deterministic offline execution gate
        run: python3 scripts/run_builder_offline.py
