name: Skill Architect — H3 Skill Static Audit V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_skill_static_v1.py'
      - 'targets/h3-active.json'
      - 'targets/TARGET-IDENTITY-SCHEMA-V1.md'
      - '.github/workflows/skill-under-test-h3-static-v1.yml'

jobs:
  audit-h3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skill Architect
        uses: actions/checkout@v4

      - name: Fetch H3 Skill under test
        run: |
          set -euo pipefail
          mkdir -p .tmp/h3
          curl -fsSL "https://raw.githubusercontent.com/powehi-H3/minimax-h3-NSFW-skill/main/PROJECT/ACTIVE-SKILL/h3-prompt-skill-current/SKILL.md" -o .tmp/h3/SKILL.md

      - name: Run static Skill audit
        run: |
          python3 scripts/audit_skill_static_v1.py .tmp/h3/SKILL.md targets/h3-active.json | tee h3-static-audit.json

      - name: Run authority consistency heuristic
        run: |
          python3 scripts/audit_authority_consistency_v1.py .tmp/h3/SKILL.md | tee h3-authority-audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-static-audit
          path: |
            h3-static-audit.json
            h3-authority-audit.json
