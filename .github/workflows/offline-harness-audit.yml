name: Skill Builder — Offline Harness Audit (Legacy Alias)

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/fixtures/offline-builder-v0/**"
      - "scripts/audit_offline_harness_v1.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canonical V1 audit
        run: python3 scripts/audit_offline_harness_v1.py
