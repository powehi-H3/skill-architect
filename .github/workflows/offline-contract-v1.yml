name: Skill Architect — Offline Contract V1
on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/fixtures/offline-builder-v0/**"
      - "scripts/run_offline_contract_v1.py"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic offline contract suite
        run: python3 scripts/run_offline_contract_v1.py
